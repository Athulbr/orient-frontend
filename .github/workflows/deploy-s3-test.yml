name: Deploy Frontend (Test) to S3

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy Frontend to S3 (Test)
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci
        env:
          NPM_READ_TOKEN: ${{ secrets.NPM_READ_TOKEN }}

      # 4. Build frontend
      - name: Build frontend
        run: npm run build

      # 5. Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 6. Deploy to S3
      - name: Deploy build to S3
        run: |
          aws s3 sync dist/ s3://${{ secrets.S3_BUCKET_NAME_DEV }} --delete

      # 7. Invalidate CloudFront cache
      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID_DEV }} \
            --paths "/*"
