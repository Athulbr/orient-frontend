# Workflow for App1 (frontend-v2/.github/workflows/deploy.yml)
name: Deploy Frontend to EC2

on:
  workflow_dispatch:
    inputs:
      approve:
        description: "Type 'yes' to approve deployment"
        required: true
        default: "no"

jobs:
  deploy:
    if: ${{ github.event.inputs.approve == 'yes' }}
    uses: rehab-mart/cicd-actions/.github/workflows/reusable-deploy.yml@main
    with:
      app_name: "frontend-v2" # Name of the application to be deployed
      app_port: "8080"        # Port on which the application will run
      branch: "main"
    secrets:
      EC2_HOST: ${{ secrets.EC2_HOST }}       # EC2 host address
      EC2_USER: ${{ secrets.EC2_USER }}       # EC2 username
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }} # SSH key for accessing the EC2 instance
      GIT_TOKEN: ${{ secrets.GIT_TOKEN }}     # Git token for cloning the repository
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
